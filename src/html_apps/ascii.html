<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ASCII Edge Cam</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      canvas { display: block; width: 100vw; height: 100vh; }
      #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; font-size: 18px; cursor: pointer; z-index: 10; }
      video { display: none; }
    </style>
  </head>
  <body class="fullscreen-app">
    <a href="/" class="back-btn">&larr; Back home</a>
    
    <button id="start-btn" style="background-color: var(--accent); color: var(--bg-color); border: 1px solid var(--accent); border-radius: 5px; padding: 15px 30px; font-size: 18px; cursor: pointer; z-index: 10;">Start Camera</button>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="ascii-canvas"></canvas>
    
    <script type="module" src="../js/ascii.js"></script>
  </body>
</html>
