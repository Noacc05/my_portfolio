  <text x="85" y="100" text-anchor="middle" fill="#a0a0a0" font-size="8" font-family="monospace">Current State</text>
  <!-- Arrow -->
  <line x1="155" y1="55" x2="245" y2="55" stroke="#b16de4" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="245,52 252,55 245,58" fill="#b16de4"/>
  <!-- SSID list right (target) -->
  <rect x="255" y="20" width="130" height="18" rx="3" fill="none" stroke="#4caf50" stroke-width="1"/>
  <text x="263" y="33" fill="#4caf50" font-size="8" font-family="monospace">✓ WPA3 Bridge VLAN</text>
  <rect x="255" y="43" width="130" height="18" rx="3" fill="none" stroke="#4caf50" stroke-width="1"/>
  <text x="263" y="56" fill="#4caf50" font-size="8" font-family="monospace">✓ WPA3 Bridge VLAN</text>
  <rect x="255" y="66" width="130" height="18" rx="3" fill="none" stroke="#4caf50" stroke-width="1"/>
  <text x="263" y="79" fill="#4caf50" font-size="8" font-family="monospace">✓ WPA3 Bridge VLAN</text>
  <text x="320" y="100" text-anchor="middle" fill="#a0a0a0" font-size="8" font-family="monospace">Target Standard</text>
