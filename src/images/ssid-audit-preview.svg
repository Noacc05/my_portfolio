<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <rect width="400" height="180" fill="#151518"/>
  <!-- WiFi icon -->
  <path d="M200,130 L200,130" fill="none" stroke="#b16de4" stroke-width="0"/>
  <circle cx="200" cy="135" r="4" fill="#b16de4"/>
  <path d="M182,120 Q200,105 218,120" fill="none" stroke="#b16de4" stroke-width="1.5"/>
  <path d="M172,110 Q200,90 228,110" fill="none" stroke="#b16de4" stroke-width="1.5"/>
  <path d="M162,100 Q200,75 238,100" fill="none" stroke="#b16de4" stroke-width="1.5"/>
  <!-- SSID list left -->
  <rect x="20" y="20" width="130" height="18" rx="3" fill="none" stroke="#f44336" stroke-width="1"/>
  <text x="28" y="33" fill="#f44336" font-size="8" font-family="monospace">✗ WPA2-only NAT</text>
  <rect x="20" y="43" width="130" height="18" rx="3" fill="none" stroke="#f44336" stroke-width="1"/>
