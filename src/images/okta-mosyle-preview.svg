  <line x1="60" y1="151" x2="60" y2="160" stroke="#333" stroke-width="1"/>
  <circle cx="80" cy="145" r="5" fill="none" stroke="#333" stroke-width="1"/>
  <line x1="80" y1="151" x2="80" y2="160" stroke="#333" stroke-width="1"/>
