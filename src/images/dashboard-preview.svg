  <rect x="220" y="245" width="55" height="55" rx="3" fill="#b16de4" opacity="0.6"/>
  <rect x="295" y="255" width="55" height="45" rx="3" fill="#b16de4" opacity="0.6"/>
  <rect x="370" y="260" width="55" height="40" rx="3" fill="#b16de4" opacity="0.5"/>
  <rect x="445" y="268" width="55" height="32" rx="3" fill="#b16de4" opacity="0.4"/>
  <rect x="520" y="272" width="55" height="28" rx="3" fill="#b16de4" opacity="0.35"/>
  <rect x="595" y="278" width="55" height="22" rx="3" fill="#b16de4" opacity="0.3"/>
