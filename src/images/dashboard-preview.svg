  <text x="470" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#dcdcaa" text-anchor="middle">needs review</text>

  <rect x="565" y="30" width="175" height="80" rx="6" fill="#151518" stroke="#333"/>
  <text x="652" y="62" font-family="system-ui,sans-serif" font-size="26" font-weight="bold" fill="#b16de4" text-anchor="middle">2</text>
  <text x="652" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#888" text-anchor="middle">Serial Mismatches</text>
  <text x="652" y="98" font-family="system-ui,sans-serif" font-size="10" fill="#ff5f57" text-anchor="middle">action needed</text>

  <!-- Bar chart -->
  <rect x="40" y="130" width="720" height="200" rx="6" fill="#151518" stroke="#333"/>
