  <rect x="215" y="30" width="160" height="80" rx="6" fill="#151518" stroke="#333"/>
  <text x="295" y="62" font-family="system-ui,sans-serif" font-size="26" font-weight="bold" fill="#b16de4" text-anchor="middle">99.3%</text>
