  <text x="472" y="315" font-family="monospace" font-size="9" fill="#666" text-anchor="middle">iMac</text>
  <text x="547" y="315" font-family="monospace" font-size="9" fill="#666" text-anchor="middle">MBP 13</text>
  <text x="622" y="315" font-family="monospace" font-size="9" fill="#666" text-anchor="middle">Other</text>
