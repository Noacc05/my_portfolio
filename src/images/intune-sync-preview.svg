<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <rect width="400" height="180" fill="#151518"/>
  <!-- Intune box -->
  <rect x="20" y="60" width="90" height="60" rx="6" fill="none" stroke="#00a4ef" stroke-width="1.5"/>
  <text x="65" y="85" text-anchor="middle" fill="#00a4ef" font-size="10" font-family="monospace">Intune</text>
  <text x="65" y="100" text-anchor="middle" fill="#a0a0a0" font-size="8" font-family="monospace">MS Graph</text>
  <!-- Arrow 1 -->
  <line x1="115" y1="90" x2="145" y2="90" stroke="#b16de4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Okta box -->
  <rect x="150" y="60" width="90" height="60" rx="6" fill="none" stroke="#b16de4" stroke-width="1.5"/>
  <text x="195" y="85" text-anchor="middle" fill="#b16de4" font-size="10" font-family="monospace">Okta</text>
  <text x="195" y="100" text-anchor="middle" fill="#a0a0a0" font-size="8" font-family="monospace">JWT Auth</text>
  <!-- Arrow 2 -->
  <line x1="245" y1="90" x2="275" y2="90" stroke="#b16de4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Snipe box -->
  <rect x="280" y="60" width="100" height="60" rx="6" fill="none" stroke="#4caf50" stroke-width="1.5"/>
  <text x="330" y="85" text-anchor="middle" fill="#4caf50" font-size="10" font-family="monospace">Snipe-IT</text>
  <text x="330" y="100" text-anchor="middle" fill="#a0a0a0" font-size="8" font-family="monospace">CRUD Sync</text>
  <!-- Labels -->
  <text x="200" y="30" text-anchor="middle" fill="#a0a0a0" font-size="9" font-family="monospace">Windows Device Lifecycle Pipeline</text>
  <text x="130" y="150" fill="#333" font-size="8" font-family="monospace">deprovisioned → unassign</text>
  <text x="130" y="163" fill="#333" font-size="8" font-family="monospace">new device → create asset</text>
  <!-- Arrow marker -->
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#b16de4"/></marker></defs>
</svg>